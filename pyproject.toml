[project]
name = "isaaclab-ome-env"
version = "0.0.0"
description = "Environment bundle for the Unitree locomotion dataset pipeline (IsaacLab 2.3.2 / IsaacSim 5.1, CUDA 12.8)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.7.0+cu128",
    "torchvision==0.22.0+cu128",
    "isaacsim[all,extscache]==5.1.0",
    "isaaclab",
    "isaaclab-assets",
    "isaaclab-tasks",
    "isaaclab-rl[rsl-rl]",
    "aut-unitree-g1-isaaclab",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.uv]
package = false
index-strategy = "unsafe-best-match"

# IsaacLab pins starlette==0.49.1 while IsaacSim's fastapi==0.115.7 wants <0.46.
# The official pip install ends up with starlette==0.49.1 and warns; replicate that.
override-dependencies = ["starlette==0.49.1"]

[tool.uv.sources]
isaaclab = { path = "/home/ryz5920/Project/IsaacLab/source/isaaclab", editable = true }
isaaclab-assets = { path = "/home/ryz5920/Project/IsaacLab/source/isaaclab_assets", editable = true }
isaaclab-tasks = { path = "/home/ryz5920/Project/IsaacLab/source/isaaclab_tasks", editable = true }
isaaclab-rl = { path = "/home/ryz5920/Project/IsaacLab/source/isaaclab_rl", editable = true }
aut-unitree-g1-isaaclab = { path = "source/aut_unitree_g1_isaaclab", editable = true }
